name: Refresh weekly repository report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-weekly-report.yml"
      - "scripts/refresh_dashboard.py"
      - "github_radar.py"
  schedule:
    - cron: "17 8 * * 6"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: weekly-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copilot CLI for new README summaries
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Refresh rankings and report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_TRANSLATE_PURPOSES: "1"
        run: python scripts/refresh_dashboard.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --check dashboard/app.js

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/app.js reports/ data/purpose_zh.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Refresh weekly repository report"
          git push
